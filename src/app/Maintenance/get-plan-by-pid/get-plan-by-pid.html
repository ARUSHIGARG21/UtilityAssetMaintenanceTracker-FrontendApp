<div class="container mt-4">
  
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="text-secondary">Search Result</h4>
    <button class="btn btn-sm btn-secondary" routerLink="/get-plans">← Back to All Plans</button>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger text-center shadow-sm" role="alert">
    ⚠️ {{ errorMessage }}
  </div>

  <div class="row" *ngIf="plan">
    <div class="col-md-4"> <div class="card h-100 shadow-sm">
        <div class="card-body d-flex flex-column">
          
          <h5 class="card-title text-primary font-weight-bold mb-1">{{ plan.name }}</h5>
          <small class="text-muted mb-3">Plan ID: #{{ plan.planID }}</small>
          
          <p class="card-text mb-3">
            <strong>Asset Type:</strong> {{ plan.type }}<br>
            <strong>Asset ID:</strong> {{ plan.assetID }}<br>
            <strong>Frequency:</strong> <span class="badge bg-secondary">{{ plan.frequency }}</span>
          </p>

          <hr class="my-2">

          <div class="tasks-section flex-grow-1">
            <h6 class="text-secondary font-weight-bold mb-2">Assigned Tasks</h6>
            
            <div *ngIf="!plan.tasks || plan.tasks.length === 0">
              <p class="text-muted small italic">No maintenance tasks mapped.</p>
            </div>
            
            <div *ngIf="plan.tasks && plan.tasks.length > 0" class="embedded-task-list">
              <div class="mini-task-card" *ngFor="let t of plan.tasks" 
                   style="border: 1px solid #e0e0e0; border-radius: 6px; padding: 10px; margin-bottom: 8px; background-color: #fff;">
                <div class="d-flex justify-content-between align-items-center">
                  
                  <div class="d-flex flex-column">
                    <span class="task-desc font-weight-bold text-dark">{{ t.description }}</span>
                    <span class="task-hours text-muted small">Estimated: {{ t.estimatedHours }}h</span>
                  </div>
                  
                  <app-delete-task 
                    [taskId]="t.taskID!" 
                    (deletionSuccessful)="handleTaskDeleted($event)">
                  </app-delete-task>

                </div>
              </div>
            </div>
          </div>

          <div class="card-actions d-flex gap-2 mt-3 pt-2 border-top">
            <button class="btn btn-outline-primary btn-sm flex-fill" (click)="goToUpdatePage(plan.planID!)">
              Update Plan
            </button>
            <button class="btn btn-success btn-sm flex-fill" [routerLink]="['/add-task', plan.planID]">
              + Add Task
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
