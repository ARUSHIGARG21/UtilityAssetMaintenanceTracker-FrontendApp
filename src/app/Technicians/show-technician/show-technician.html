<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-primary">Technicians</h2>
    <button class="btn btn-success add-btn" routerLink="/add-tech">
        Add Technician
        </button>
  </div>

  <div class="row">
    @for (tech of technicians; track tech.technicianID) {
      <div class="col-md-4 mb-3">
        <div class="card technician-card">
          <div class="card-body d-flex flex-column justify-content-center align-items-center text-center">
            <h5 class="card-title">{{ tech.name }}</h5>
            <h6 class="card-subtitle mb-2 text-muted">TEC: {{ tech.technicianID|number:'2.0-0'}}</h6>
            <span class="badge skill-badge">{{ tech.skillSet }}</span>
          </div>
        </div>
      </div>
    } @empty {
      <div class="col-12">
        <div class="alert alert-info text-center">
          No technicians found.
        </div>
      </div>
    }
  </div>
</div>
