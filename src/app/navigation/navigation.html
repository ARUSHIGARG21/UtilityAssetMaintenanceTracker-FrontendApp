<header>
    <h3>Asset Maintenance</h3>
    <ul>
            @if (!isLoggedIn()) {
        <button routerLink="/login" class="btn btn-primary">Login</button>
        <button routerLink="/register" class="btn btn-success">Register</button>
        }

        @if (isLoggedIn()) {
        <button (click)="logout()" class="btn btn-info">Logout</button>
        }
    </ul>

</header>
